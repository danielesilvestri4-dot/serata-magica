<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Festa Magica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one cosmic sky fixed behind everything; a single 760px column of frosted-glass panels floats over it. */
:root{
  --void:#0c0522; --deep:#1b0a40; --plum:#2c1160;
  --violet:#8b4dff; --magenta:#ff3fa4; --tang:#ff8a3d; --teal:#36d6d8;
  --lime:#ecf7a0; --cream:#fff1d2;
  --ink:#f6f0ff; --muted:#bfaee6; --faint:#8f7cbf;
  --glass:rgba(255,255,255,.075); --glass-2:rgba(255,255,255,.12); --line:rgba(255,255,255,.16);
  --ok:#7df0b4; --warn:#ffd36b; --bad:#ff7a8e;
  --cta:linear-gradient(95deg,#f3f7a4 0%,#ffe2a8 55%,#ffc3a6 100%);
  --hot:linear-gradient(120deg,var(--violet),var(--magenta) 60%,var(--tang));
  --f-display:"Gloock","Georgia","Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--void)}

/* ---------- sky ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 115%, rgba(255,138,61,.55), transparent 55%),
    radial-gradient(70% 60% at 10% 20%, rgba(139,77,255,.45), transparent 60%),
    radial-gradient(60% 50% at 95% 35%, rgba(255,63,164,.35), transparent 60%),
    linear-gradient(180deg,var(--void) 0%,var(--deep) 55%,var(--plum) 100%);}
.sky svg{position:absolute;inset:-10% -20%;width:140%;height:120%;opacity:.55;filter:saturate(1.2)}
.sky .swirl{animation:drift 38s ease-in-out infinite alternate;transform-origin:center}
.sky .swirl.b{animation-duration:52s;animation-direction:alternate-reverse}
.stars{position:absolute;inset:0;
  background-image:radial-gradient(1.4px 1.4px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#ffe9b0,transparent),radial-gradient(1.2px 1.2px at 160px 60px,#d9c8ff,transparent),radial-gradient(1px 1px at 60px 170px,#fff,transparent);
  background-size:200px 200px;opacity:.55;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,0,0) rotate(-2deg)}to{transform:translate3d(3%,-2%,0) rotate(2deg)}}
@keyframes twinkle{from{opacity:.35}to{opacity:.7}}
@media (prefers-reduced-motion:reduce){.sky .swirl,.stars,.float{animation:none!important}}

/* ---------- frame ---------- */
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(44px,11vw,84px);line-height:.95}
h2{font-size:clamp(28px,6vw,38px);line-height:1.05}
h3{font-size:22px;line-height:1.15}
p{margin:0}
.glow-text{background:linear-gradient(180deg,#fffbe6 0%,var(--lime) 60%,#ffd59a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px rgba(255,200,120,.25))}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:13.5px;letter-spacing:.02em}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

.glass{background:linear-gradient(160deg,var(--glass-2),var(--glass));border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:0 20px 60px -30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);padding:22px}
.glass.tight{padding:16px;border-radius:var(--r-md)}
.panel-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}

/* ---------- controls ---------- */
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;letter-spacing:.02em}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=url],select{
  width:100%;font:inherit;color:var(--ink);background:rgba(10,4,30,.45);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:rgba(236,247,160,.7);box-shadow:0 0 0 4px rgba(236,247,160,.12)}
select option{background:var(--deep)}
.btn{appearance:none;border:0;font:inherit;font-weight:700;cursor:pointer;border-radius:999px;padding:13px 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,box-shadow .2s,opacity .2s;color:#1b0a40;background:var(--cta);box-shadow:0 10px 30px -10px rgba(255,210,150,.6)}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 34px -10px rgba(255,210,150,.75)}
.btn:active{transform:translateY(0)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.btn.big{padding:16px 28px;font-size:17px}
.btn.wide{width:100%}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.hot{background:var(--hot);color:#fff;box-shadow:0 10px 30px -10px rgba(255,63,164,.7)}
.btn.danger{background:rgba(255,122,142,.14);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,122,142,.4)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:999px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;font:inherit}
.copy{display:flex;align-items:center;gap:8px;background:rgba(10,4,30,.45);border:1px dashed rgba(236,247,160,.4);border-radius:14px;padding:10px 10px 10px 14px}
.copy .mono{flex:1;min-width:0;overflow-wrap:anywhere}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.02em}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:rgba(125,240,180,.12)}
.pill.wait{color:var(--warn);background:rgba(255,211,107,.12)}
.pill.host{color:#ffb8e0;background:rgba(255,63,164,.16)}
.pill.host::before{display:none}

/* ---------- gate ---------- */
.gate{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:26px;text-align:center;align-items:center}
.gate .lede{font-size:18px;color:var(--cream);max-width:30ch;opacity:.9}
.gate form{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.gate input{text-align:center;font-size:17px;padding:16px;border-radius:999px}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffb36b 30%,#ff3fa4 60%,#5b1fb8 85%);box-shadow:0 0 80px 10px rgba(255,120,160,.45),inset -12px -16px 30px rgba(40,0,80,.6);position:relative}
.orb::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:1.5px solid rgba(236,247,160,.5);transform:rotate(-18deg) scaleY(.35)}
.float{animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}

/* ---------- header + tabs ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.topbar .who{flex:1;min-width:0}
.topbar .who h2{font-size:clamp(26px,6vw,34px)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px;margin:0 0 18px;border-radius:999px;background:rgba(18,7,46,.72);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:560px){.tabs{flex-wrap:wrap;overflow:visible;border-radius:22px}.tab{flex:1 1 40%;text-align:center}}
.head-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.head-acts .btn[aria-pressed=true]{box-shadow:0 0 0 3px rgba(255,184,224,.45)}
.collapse-btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;flex-shrink:0}
.collapse-btn svg{width:18px;height:18px;transition:transform .25s}
.collapse-btn[aria-expanded=true] svg{transform:rotate(180deg)}
.car-sum{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px}
.car-sum span{background:rgba(10,4,30,.45);border-radius:999px;padding:4px 10px;border:1px solid var(--line)}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab[aria-selected=true]{background:var(--cta);color:#1b0a40}
.tab.admin{color:#ffb8e0}
.tab.admin[aria-selected=true]{background:var(--hot);color:#fff}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(10,4,30,.5);border:1px solid var(--line);gap:4px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--glass-2);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(236,247,160,.5)}

/* ---------- avatars ---------- */
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(255,255,255,.25);background:var(--plum)}
.av.lg{width:96px;height:96px;border-width:3px;box-shadow:0 0 0 6px rgba(236,247,160,.12),0 0 40px rgba(255,63,164,.35)}
.av.sm{width:30px;height:30px;border-width:1.5px}
.av.xs{width:26px;height:26px;border-width:1.5px}
.upload{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.upload input[type=file]{display:none}

/* ---------- info tiles ---------- */
.hero-card{position:relative;overflow:hidden;padding:26px}
.hero-card::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,63,164,.45),transparent 70%)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px;position:relative;z-index:1}
@media (max-width:520px){.facts{grid-template-columns:1fr}}
.fact{background:rgba(10,4,30,.4);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.fact .k{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.fact .v{font-size:17px;font-weight:600;margin-top:4px}
.fact .v.big{font-family:var(--f-display);font-size:26px;font-weight:400}
.countdown{font-variant-numeric:tabular-nums}

/* ---------- cars ---------- */
.garage{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.car{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-md);background:linear-gradient(170deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid var(--line);position:relative}
.car.mine{border-color:rgba(236,247,160,.55);box-shadow:0 0 0 4px rgba(236,247,160,.07)}
.car svg.vehicle{width:100%;height:auto;max-width:100%;display:block}
.car .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13.5px}
.car .meta span{background:rgba(10,4,30,.45);border-radius:999px;padding:4px 10px;border:1px solid var(--line)}
.seats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seat{width:30px;height:30px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-size:11px;color:var(--faint);overflow:hidden}
.seat img{width:100%;height:100%;object-fit:cover}
.seat.res{border-color:rgba(255,211,107,.7);color:var(--warn);background:rgba(255,211,107,.08);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:999px;background:rgba(255,211,107,.12);color:var(--warn);font-size:13px;font-weight:600;border:1px solid rgba(255,211,107,.35)}
.chip button{appearance:none;border:0;background:rgba(0,0,0,.25);color:inherit;width:22px;height:22px;border-radius:50%;cursor:pointer;font:inherit;line-height:1}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty svg{width:120px;opacity:.75;margin-bottom:8px}

/* ---------- people ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px}
.person{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.person .av{width:72px;height:72px}
.person .nick{font-weight:700;font-size:14px;max-width:100%;overflow-wrap:anywhere}
.meter{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;background:var(--hot);border-radius:999px}

/* ---------- admin ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
.kpi{padding:14px 16px;border-radius:var(--r-md);background:rgba(10,4,30,.45);border:1px solid var(--line)}
.kpi .n{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi.good .n{color:var(--ok)} .kpi.pend .n{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);background:rgba(10,4,30,.38);border:1px solid var(--line)}
.lrow .info{min-width:0}
.lrow .name{font-weight:700;overflow-wrap:anywhere}
.lrow .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.lrow .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.lrow{grid-template-columns:auto 1fr}.lrow .acts{grid-column:1/-1;justify-content:flex-start}}
.pw{display:inline-flex;align-items:center;gap:6px;background:rgba(139,77,255,.18);border-radius:8px;padding:2px 8px;margin-top:4px}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);margin:0}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:44px;height:26px;border-radius:999px;background:rgba(255,255,255,.15);position:relative;transition:background .2s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked + .tr{background:linear-gradient(90deg,#4fd9a0,var(--ok))}
.switch input:checked + .tr::after{transform:translateX(18px)}
.switch input:focus-visible + .tr{outline:2px solid var(--lime);outline-offset:2px}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.12)}
.steps i.on{background:var(--cta)}

/* ---------- modal + toast ---------- */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(8,2,22,.6);backdrop-filter:blur(6px);padding:max(16px,env(safe-area-inset-left,0px))}
.modal .glass{max-width:400px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;background:var(--cta);color:#1b0a40;font-weight:700;padding:11px 20px;border-radius:999px;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.demo-flag{font-size:11px;font-weight:700;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.footer-note{text-align:center;color:var(--faint);font-size:12.5px;margin-top:26px}
.linkish{color:var(--lime);text-decoration:none;font-weight:600}
.linkish:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="gA" x1="0" x2="1"><stop offset="0" stop-color="#ff3fa4"/><stop offset=".5" stop-color="#ff8a3d"/><stop offset="1" stop-color="#8b4dff"/></linearGradient>
      <linearGradient id="gB" x1="0" x2="1"><stop offset="0" stop-color="#36d6d8"/><stop offset="1" stop-color="#8b4dff"/></linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    </defs>
    <g class="swirl" filter="url(#soft)">
      <path d="M-50 640 C 150 520, 300 760, 520 620 S 860 470, 1050 600 S 1250 700, 1300 640 L1300 900 L-50 900Z" fill="url(#gA)" opacity=".75"/>
      <path d="M-50 140 C 200 60, 340 260, 560 170 S 900 40, 1250 160" stroke="url(#gB)" stroke-width="70" fill="none" opacity=".55"/>
    </g>
    <g class="swirl b" filter="url(#soft)">
      <path d="M-80 760 C 180 680, 360 860, 640 740 S 1000 640, 1300 760" stroke="#ffcf7a" stroke-width="36" fill="none" opacity=".45"/>
      <path d="M1250 300 C 1050 380, 980 220, 800 300 S 520 430, 300 330" stroke="#ff3fa4" stroke-width="50" fill="none" opacity=".4"/>
      <circle cx="980" cy="160" r="70" fill="#ffd59a" opacity=".55"/>
    </g>
  </svg>
  <div class="stars"></div>
</div>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

/* ---------- state + Supabase sync ---------- */
function defaultParty(){
  return { name:"Festa Magica", place:"Piazza dell'Isolotto, Firenze",
    maps:"https://www.google.com/maps/search/?api=1&query=Piazza+dell%27Isolotto+Firenze",
    date:"2026-12-12", time:"21:30", fee:30,
    iban:"IT60 X054 2811 1010 0000 0123 456", holder:"Festa Magica" };
}
let sb = null, channel = null;
let state = { party:defaultParty(), users:[], cars:[] };
let synced = { party:null, users:{}, cars:{} };
let loaded = false, loadError = null;
function loadSession(){ try{ return JSON.parse(localStorage.getItem(SKEY)) || null; }catch(e){ return null; } }
let session = loadSession();
const ui = { carOpen:false, dirty:false, tab:"festa", admin:"festa", guestView:"choice", photo:null, pending:{}, passwords:{}, pwFor:-1, busy:false };
function setSession(s){ session = s; try{ s ? localStorage.setItem(SKEY, JSON.stringify(s)) : localStorage.removeItem(SKEY); }catch(e){} }

const USER_COLS = "id,ruolo,nome,cognome,nick,foto,pagato,viaggio,avviso,creato";
const fromParty = r => ({ name:r.nome, place:r.luogo, maps:r.maps, date:r.data, time:String(r.ora||"").slice(0,5), fee:Number(r.quota)||0, iban:r.iban, holder:r.intestatario||"" });
const toParty = p => ({ nome:p.name, luogo:p.place, maps:p.maps, data:p.date, ora:p.time, quota:p.fee, iban:p.iban, intestatario:p.holder });
const fromUser = r => ({ id:r.id, role:r.ruolo, nome:r.nome, cognome:r.cognome||"", nick:r.nick, photo:r.foto, paid:!!r.pagato, ride:r.viaggio, notice:r.avviso, created:Date.parse(r.creato)||0 });
const toUser = u => ({ id:u.id, ruolo:u.role, nome:u.nome, cognome:u.cognome||"", nick:u.nick, foto:u.photo||null, pagato:!!u.paid, viaggio:u.ride||null, avviso:u.notice||null });
const fromCar = r => ({ id:r.id, driverId:r.guidatore_id, time:r.orario, from:r.partenza, seats:r.posti, passengers:r.passeggeri||[], reservations:r.riservati||[], created:Date.parse(r.creato)||0 });
const toCar = c => ({ id:c.id, guidatore_id:c.driverId, orario:c.time, partenza:c.from, posti:c.seats, passeggeri:c.passengers, riservati:c.reservations });
const snap = o => JSON.stringify(o);

function markSynced(){
  synced.party = snap(toParty(state.party));
  synced.users = Object.fromEntries(state.users.map(u=>[u.id, snap(toUser(u))]));
  synced.cars  = Object.fromEntries(state.cars.map(c=>[c.id, snap(toCar(c))]));
}
async function fetchAll(){
  const [p,u,c] = await Promise.all([
    sb.from("festa").select("*").eq("id",1).maybeSingle(),
    sb.from("utenti").select(USER_COLS).order("creato"),
    sb.from("auto").select("*").order("creato")
  ]);
  const err = p.error || u.error || c.error; if(err) throw err;
  state.party = p.data ? fromParty(p.data) : defaultParty();
  state.users = (u.data||[]).map(fromUser);
  state.cars  = (c.data||[]).map(fromCar);
  markSynced();
}

let queue = Promise.resolve();
function sync(){
  queue = queue.then(doSync).catch(e=>{ console.error(e); toast("Modifica non salvata, riprova"); return refresh(true); });
  return queue;
}
async function doSync(){
  let changed = false;
  const pp = snap(toParty(state.party));
  if(pp !== synced.party){ const { error } = await sb.from("festa").update(toParty(state.party)).eq("id",1); if(error) throw error; synced.party = pp; changed = true; }
  for(const u of state.users){
    const s = snap(toUser(u)); if(synced.users[u.id] === s) continue;
    const q = synced.users[u.id] === undefined ? sb.from("utenti").insert({ ...toUser(u), password:u.pass }) : sb.from("utenti").update(toUser(u)).eq("id",u.id);
    const { error } = await q; if(error) throw error; synced.users[u.id] = s; changed = true;
  }
  for(const c of state.cars){
    const s = snap(toCar(c)); if(synced.cars[c.id] === s) continue;
    const q = synced.cars[c.id] === undefined ? sb.from("auto").insert(toCar(c)) : sb.from("auto").update(toCar(c)).eq("id",c.id);
    const { error } = await q; if(error) throw error; synced.cars[c.id] = s; changed = true;
  }
  const carIds = new Set(state.cars.map(c=>c.id));
  for(const id of Object.keys(synced.cars)) if(!carIds.has(id)){ const { error } = await sb.from("auto").delete().eq("id",id); if(error) throw error; delete synced.cars[id]; changed = true; }
  const userIds = new Set(state.users.map(u=>u.id));
  for(const id of Object.keys(synced.users)) if(!userIds.has(id)){ const { error } = await sb.from("utenti").delete().eq("id",id); if(error) throw error; delete synced.users[id]; changed = true; }
  if(changed) ping();
}
function ping(){ try{ channel && channel.send({ type:"broadcast", event:"changed", payload:{} }); }catch(e){} }

let refreshT = null;
function scheduleRefresh(){ clearTimeout(refreshT); refreshT = setTimeout(()=>refresh(false), 350); }
async function refresh(force){
  await queue.catch(()=>{});
  try{ await fetchAll(); loaded = true; loadError = null; }
  catch(e){ console.error(e); if(!loaded){ loadError = e; } }
  const typing = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.type!=="checkbox";
  if(force || (!typing && !ui.dirty)) render(); else setTimeout(()=>scheduleRefresh(), 3000);
}
function commit(){ ui.dirty = false; render(); return sync(); }

async function boot(){
  if(!window.supabase || /INSERISCI/.test(SUPABASE_URL)){ loadError = { message:"Collegamento a Supabase non configurato." }; render(); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  channel = sb.channel("festa-magica", { config:{ broadcast:{ self:false } } });
  channel.on("broadcast", { event:"changed" }, ()=>scheduleRefresh()).subscribe();
  setInterval(()=>{ if(document.visibilityState==="visible") scheduleRefresh(); }, 20000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") scheduleRefresh(); });
  await refresh(true);
}
async function loadPasswords(){
  if(!session || !session.hostPass) return;
  ui.pwFor = state.users.length;
  const { data, error } = await sb.rpc("password_utenti", { p_host: session.hostPass });
  if(error){ console.error(error); return; }
  ui.passwords = Object.fromEntries((data||[]).map(r=>[r.id, r.password]));
  if(ui.tab==="regia" && ui.admin==="pagamenti") render();
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
const me = () => session && session.uid ? state.users.find(u=>u.id===session.uid) : null;
const isHost = u => u && u.role==="host";
const userById = id => state.users.find(u=>u.id===id);
const photoOf = u => (u && u.photo) || initialsAvatar(u ? (u.nick||u.nome) : "?");
const carOf = uid => state.cars.find(c=>c.driverId===uid);
const carWith = uid => state.cars.find(c=>c.passengers.includes(uid));
const freeSeats = c => c.seats - c.passengers.length - c.reservations.length;
const fullName = u => [u.nome,u.cognome].filter(Boolean).join(" ");
function fmtDate(d){ try{ return new Date(d+"T12:00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }catch(e){ return d; } }
function countdown(){
  const t = new Date(state.party.date+"T"+(state.party.time||"00:00")); const ms = t - new Date();
  if(isNaN(ms)) return ""; if(ms<=0) return "La festa è iniziata";
  const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5);
  return d>0 ? `Mancano ${d} giorni e ${h} ore` : `Mancano ${h} ore`;
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
function copyText(text, label){
  const done = ()=>toast(label+" copiato");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("Seleziona e copia a mano: "+text); } ta.remove();
}
function resizeImage(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const S=240, c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d");
      const m=Math.min(img.width,img.height); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      res(c.toDataURL("image/jpeg",.82)); }; img.onerror=rej; img.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}
function showModal(title, body){
  $("#modal-root").innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="glass"><div class="orb float" style="width:70px;height:70px"></div><h3>${esc(title)}</h3><p class="muted">${esc(body)}</p><button class="btn wide" data-act="close-modal">Fantastico</button></div></div>`;
}

/* ---------- ride logic ---------- */
function leaveAllCars(uid){ state.cars.forEach(c=>{ c.passengers = c.passengers.filter(p=>p!==uid); }); }
function deleteCar(car){
  car.passengers.forEach(pid=>{ const p=userById(pid); if(p) p.notice = `La macchina di ${userById(car.driverId)?.nick||"un guidatore"} è stata cancellata: scegli un altro passaggio.`; });
  state.cars = state.cars.filter(c=>c!==car);
}
function claimReservations(u){
  const full = norm(fullName(u)); let found=null;
  state.cars.forEach(c=>{
    const i = c.reservations.findIndex(r=>r.name && norm(r.name)===full);
    if(i>-1 && !found && c.driverId!==u.id){ c.reservations.splice(i,1); leaveAllCars(u.id); c.passengers.push(u.id); u.ride="ride"; found=c; }
  });
  return found;
}
function removeUser(uid){
  const car = carOf(uid); if(car) deleteCar(car);
  leaveAllCars(uid);
  state.users = state.users.filter(u=>u.id!==uid);
}
/* =========================================================
   RENDER
   ========================================================= */
function viewLoading(){
  return `<section class="gate"><div class="orb float"></div><p class="lede">Accendo le stelle…</p></section>`;
}
function viewProblem(msg){
  return `<section class="gate"><div class="orb"></div><div class="stack" style="align-items:center"><h2 class="glow-text">Il cosmo non risponde</h2>
    <p class="lede">Non riesco a caricare i dati della festa. Controlla la connessione e ricarica la pagina.</p>
    <p class="muted mono" style="font-size:12px">${esc(msg||"")}</p>
    <button class="btn" onclick="location.reload()">Ricarica</button></div></section>`;
}
function render(){
  const app = $("#app");
  if(loadError){ app.innerHTML = viewProblem(loadError.message); return; }
  if(!loaded){ app.innerHTML = viewLoading(); return; }
  if(!session){ app.innerHTML = viewGate(); return; }
  if(session.gate==="host" && !session.uid){
    const h = Object.values(HOSTS).find(h=>h.id===session.hostId);
    if(!h){ setSession(null); return render(); }
    const existing = userById(session.hostId);
    if(existing){ setSession({ uid:existing.id, hostPass:session.hostPass }); return render(); }
    app.innerHTML = viewHostPhoto(h); return;
  }
  if(session.gate==="guest" && !session.uid){
    app.innerHTML = ui.guestView==="login" ? viewLogin() : ui.guestView==="register" ? viewRegister() : viewGuestChoice(); return;
  }
  const u = me();
  if(!u){ setSession(null); return render(); }
  if(session.step){ app.innerHTML = viewWizard(u); return; }
  app.innerHTML = viewApp(u);
  if(u.notice && !$("#modal-root").innerHTML){ const n = u.notice; u.notice = null; sync(); showModal("Novità sul passaggio", n); }
}

/* ---------- wizard (steps 2-4) ---------- */
function viewWizard(u){
  const step = session.step;
  const bar = [1,2,3,4].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("");
  let body="", title="", eyebrow="";
  if(step===2){ eyebrow="Passo 2 di 4 · La festa"; title=`Ciao ${esc(u.nick)}, ecco dove si va.`; body = partyCard(); }
  if(step===3){ eyebrow="Passo 3 di 4 · Quota"; title="Il biglietto per l'orbita."; body = paymentCard(u); }
  if(step===4){ eyebrow="Passo 4 di 4 · Passaggi"; title="Come arrivi?"; body = ridePanel(u); }
  return `<section class="stack" style="padding-top:12px">
    <div class="steps">${bar}</div>
    <span class="eyebrow">${eyebrow}</span>
    <h2 class="glow-text">${title}</h2>
    ${body}
    <div class="spread">
      ${step>2?`<button class="btn ghost" data-act="wiz" data-to="${step-1}">Indietro</button>`:`<span></span>`}
      <button class="btn" data-act="wiz" data-to="${step<4?step+1:"done"}">${step<4?"Continua":"Vai alla festa"} <span aria-hidden="true">→</span></button>
    </div>
  </section>`;
}

function seatsRow(c){
  const items = [];

  for(let i=0;i<freeSeats(c);i++) items.push(`<span class="seat" aria-hidden="true">+</span>`);
  return `<div class="seats">${items.join("")}</div>`;
}

function adminCars(){

/* =========================================================
   EVENTS
   ========================================================= */
function newId(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function lockForm(f, on){ f.querySelectorAll("button,input").forEach(x=>x.disabled = on); }

document.addEventListener("input", e=>{ if(e.target.closest("form") && !e.target.closest("#gate-form,#login-form")) ui.dirty = true; });
document.addEventListener("submit", async e=>{
  e.preventDefault();
  const f = e.target;
  ui.dirty = false;
  if(f.id==="gate-form"){
    const v = $("#gate-pass").value.trim();
    if(v===GUEST_PASS){ setSession({ gate:"guest" }); ui.guestView="choice"; render(); }
    else if(HOSTS[v]){
      const h = HOSTS[v]; ui.photo = null; const ex = userById(h.id);
      setSession(ex ? { uid:h.id, hostPass:v } : { gate:"host", hostId:h.id, hostPass:v });
      if(ex) toast("Benvenuto Host: "+h.name); render();
    }
    else $("#gate-err").textContent = "Password non valida";
  }
  if(f.id==="login-form"){
    const err = $("#lg-err"); lockForm(f,true);
    const { data, error } = await sb.rpc("login_ospite", { p_nick:$("#lg-nick").value.trim(), p_password:$("#lg-pass").value });
    lockForm(f,false);
    if(error){ err.textContent = "Accesso non riuscito, riprova tra poco."; return; }
    if(!data){ err.textContent = "Nickname o password non corretti."; return; }
    await refresh(true); setSession({ uid:data }); ui.tab="festa"; render();
  }
  if(f.id==="reg-form"){
    const nome=$("#rg-nome").value.trim(), cognome=$("#rg-cognome").value.trim(), nick=$("#rg-nick").value.trim(), pass=$("#rg-pass").value;
    const err = $("#rg-err");
    if(!ui.photo){ err.textContent="Carica una foto profilo per continuare."; return; }
    lockForm(f,true);
    const { count } = await sb.from("utenti").select("id", { count:"exact", head:true });
    if(count >= MAX_GUESTS){ lockForm(f,false); err.textContent="La festa è al completo."; return; }
    const u = { id:newId("u-"), role:"guest", nome, cognome, nick, photo:ui.photo, paid:false, ride:null, created:Date.now() };
    const { error } = await sb.from("utenti").insert({ ...toUser(u), password:pass });
    if(error){ lockForm(f,false); err.textContent = error.code==="23505" ? "Questo nickname è già preso, scegline un altro." : "Registrazione non riuscita: "+error.message; return; }
    state.users.push(u); synced.users[u.id] = snap(toUser(u));
    const claimed = claimReservations(u);
    ui.photo = null; setSession({ uid:u.id, step:2 }); commit();
    if(claimed) showModal("Hai già un passaggio!", `Ti è stato riservato un posto nella macchina di ${userById(claimed.driverId)?.nick}.`);
  }
  if(f.id==="host-photo-form"){
    if(!ui.photo){ $("#hp-err").textContent="La foto profilo è obbligatoria per entrare."; return; }
    const h = Object.values(HOSTS).find(h=>h.id===session.hostId);
    const u = { id:h.id, role:"host", nome:h.name, cognome:"", nick:h.name, photo:ui.photo, paid:false, ride:null, created:Date.now() };
    lockForm(f,true);
    const { error } = await sb.from("utenti").insert({ ...toUser(u), password:session.hostPass });
    if(error && error.code!=="23505"){ lockForm(f,false); $("#hp-err").textContent="Salvataggio non riuscito: "+error.message; return; }
    ui.photo = null; ui.tab = "regia"; setSession({ uid:h.id, hostPass:session.hostPass });
    await refresh(true); ping(); toast("Benvenuto Host: "+h.name);
  }
  if(f.id==="car-form"){
    const u = me(); const time=$("#car-time").value, from=$("#car-from").value.trim(), seats=parseInt($("#car-seats").value,10);
    const car = carOf(u.id);
    const used = car ? car.passengers.length + car.reservations.length : 0;
    if(seats < used){ $("#car-err").textContent = `Hai già ${used} posti occupati o riservati: non puoi scendere sotto questo numero.`; return; }
    if(car){ Object.assign(car, { time, from, seats }); ui.carOpen=false; toast("Auto aggiornata"); }
    else { leaveAllCars(u.id); state.cars.push({ id:newId("car-"), driverId:u.id, time, from, seats, passengers:[], reservations:[], created:Date.now() }); toast("Auto pubblicata"); ui.carOpen=false; }
    u.ride = "drive"; commit();
  }
  if(f.id==="party-form"){
    Object.assign(state.party, { name:$("#pf-name").value.trim(), date:$("#pf-date").value, time:$("#pf-time").value, place:$("#pf-place").value.trim(), maps:$("#pf-maps").value.trim(), fee:Number($("#pf-fee").value)||0, holder:$("#pf-holder").value.trim(), iban:$("#pf-iban").value.trim() });
    commit(); toast("Info festa aggiornate per tutti");
  }
});

document.addEventListener("change", async e=>{
  const t = e.target;
  if(t.id==="photo-file" && t.files[0]){
    try{ ui.photo = await resizeImage(t.files[0]); $("#photo-prev").src = ui.photo; }
    catch(err){ toast("Immagine non leggibile, prova un altro file"); }
  }
  if(t.dataset.chg==="paid"){ const u = userById(t.dataset.id); if(u){ u.paid = t.checked; commit(); toast(u.paid ? `${u.nick}: pagamento confermato` : `${u.nick}: segnato da pagare`); } }
  if(t.dataset.chg==="move"){
    const from = state.cars.find(c=>c.id===t.dataset.car); const pid = t.dataset.pid; const v = t.value; if(!v || !from) return;
    from.passengers = from.passengers.filter(p=>p!==pid);
    if(v!=="__out"){ const to = state.cars.find(c=>c.id===v); if(to && freeSeats(to)>0) to.passengers.push(pid); }
    const p = userById(pid); if(p) p.notice = v==="__out" ? "Un host ti ha tolto dall'auto: scegli un altro passaggio." : `Un host ti ha spostato nell'auto di ${userById(state.cars.find(c=>c.id===v)?.driverId)?.nick}.`;
    commit();
  }
});

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act; const u = me();
  switch(a){
    case "close-modal": $("#modal-root").innerHTML=""; break;
    case "logout": ui.dirty=false; setSession(null); ui.photo=null; ui.pending={}; ui.tab="festa"; ui.passwords={}; ui.pwFor=-1; render(); break;
    case "guest-view": ui.guestView=el.dataset.v; ui.photo=null; render(); break;
    case "copy": copyText(el.dataset.text, el.dataset.label); break;
    case "tab": ui.tab=el.dataset.t; ui.pending={}; ui.dirty=false; render(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "admin-tab": ui.admin=el.dataset.t; ui.pending={}; ui.dirty=false; if(ui.admin==="pagamenti") ui.pwFor=-1; render(); break;
    case "wiz": {
      const to = el.dataset.to;
      if(to==="done"){ setSession({ uid:u.id }); ui.tab="festa"; toast("Benvenuto alla "+state.party.name); }
      else setSession({ uid:u.id, step:+to });
      render(); window.scrollTo({top:0}); break;
    }
    case "ride-mode": {
      const mode = el.dataset.mode; const car = carOf(u.id);
      if(mode==="ride" && car){ if(car.passengers.length){ ui.pending.dropCar=true; render(); break; } deleteCar(car); }
      if(mode==="drive") leaveAllCars(u.id);
      u.ride = mode; ui.pending={}; commit(); break;
    }
    case "toggle-car": ui.carOpen=!ui.carOpen; ui.dirty=false; render(); break;
    case "cancel-drop": ui.pending={}; render(); break;
    case "confirm-drop": { const car=carOf(u.id); if(car) deleteCar(car); u.ride="ride"; ui.pending={}; commit(); toast("Auto cancellata, passeggeri avvisati"); break; }
    case "join-car": { const c=state.cars.find(x=>x.id===el.dataset.id); if(!c||freeSeats(c)<=0) break; leaveAllCars(u.id); c.passengers.push(u.id); u.ride="ride"; commit(); toast(`Sei a bordo con ${userById(c.driverId)?.nick}`); break; }
    case "leave-car": leaveAllCars(u.id); commit(); toast("Sei sceso dall'auto"); break;
    case "res-add-user": {
      const car=carOf(u.id); const id=$("#res-user").value; if(!car||!id) break; const p=userById(id);
      leaveAllCars(id); car.passengers.push(id); p.ride="ride"; p.notice=`Ti è stato riservato un posto nella macchina di ${u.nick}.`;
      commit(); toast(`${p.nick} è a bordo`); break;
    }
    case "res-add-name": {
      const car=carOf(u.id); const n=$("#res-nome").value.trim(), c=$("#res-cognome").value.trim(); if(!car) break;
      if(!n||!c){ toast("Inserisci nome e cognome"); break; }
      const name=n+" "+c; const already = state.users.find(x=>norm(fullName(x))===norm(name));
      if(already){ leaveAllCars(already.id); car.passengers.push(already.id); already.ride="ride"; already.notice=`Ti è stato riservato un posto nella macchina di ${u.nick}.`; toast(`${already.nick} è già iscritto: messo a bordo`); }
      else { car.reservations.push({ name }); toast(`Posto riservato a ${name}`); }
      commit(); break;
    }
    case "res-remove": { const car=carOf(u.id); car.reservations.splice(+el.dataset.i,1); commit(); break; }
    case "ask-remove": ui.pending={remove:el.dataset.id}; render(); break;
    case "cancel-remove": case "cancel-car": ui.pending={}; render(); break;
    case "remove-user": { const x=userById(el.dataset.id); removeUser(el.dataset.id); ui.pending={}; commit(); toast(`${x?.nick||"Partecipante"} rimosso`); break; }
    case "ask-del-car": ui.pending={car:el.dataset.id}; render(); break;
    case "admin-del-car": { const c=state.cars.find(x=>x.id===el.dataset.id); if(c){ deleteCar(c); const d=userById(c.driverId); if(d){ d.notice="Un host ha rimosso la tua auto dai passaggi."; d.ride=null; } } ui.pending={}; commit(); toast("Auto rimossa"); break; }
  }
});

render();
boot();

</script>
</body>
</html>
